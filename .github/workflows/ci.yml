name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked development tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Audit locked development dependencies
        run: pip-audit --require-hashes -r requirements-dev.txt

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest

  linux:
    name: ${{ matrix.distribution }} smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Debian 12
            image: debian:12
            python: python3
            install: >-
              apt-get update &&
              apt-get install --yes python3 python3-pip python3-venv
          - distribution: Ubuntu 24.04
            image: ubuntu:24.04
            python: python3
            install: >-
              apt-get update &&
              apt-get install --yes python3 python3-pip python3-venv
          - distribution: Rocky Linux 9
            image: rockylinux:9
            python: python3.12
            install: >-
              dnf install --assumeyes python3.12 python3.12-pip
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test source installation
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          INSTALL_PYTHON: ${{ matrix.install }}
          PYTHON_COMMAND: ${{ matrix.python }}
        run: |
          docker run --rm \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            --env INSTALL_PYTHON \
            --env PYTHON_COMMAND \
            "${CONTAINER_IMAGE}" \
            bash -c '
              set -euo pipefail
              eval "${INSTALL_PYTHON}"
              cp -a /workspace /tmp/lincl-source
              cd /tmp/lincl-source
              "${PYTHON_COMMAND}" -m venv /tmp/lincl-venv
              /tmp/lincl-venv/bin/python -m pip install .
              cd /tmp
              /tmp/lincl-venv/bin/python \
                /tmp/lincl-source/scripts/verify_installation.py
            '

  build:
    name: Build and verify distributions
    needs: [quality, tests, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked build tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Test wheel
        run: |
          expected_version="$(python -c \
            'import lincl; print(lincl.__version__)')"
          python -m venv /tmp/lincl-wheel
          /tmp/lincl-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          actual_version="$(/tmp/lincl-wheel/bin/python -c \
            'import lincl; print(lincl.__version__)')"
          test "${actual_version}" = "${expected_version}"
          /tmp/lincl-wheel/bin/python \
            "${GITHUB_WORKSPACE}/scripts/verify_installation.py"
      - name: Test source distribution
        run: |
          expected_version="$(python -c \
            'import lincl; print(lincl.__version__)')"
          python -m venv /tmp/lincl-sdist
          /tmp/lincl-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
          cd /tmp
          actual_version="$(/tmp/lincl-sdist/bin/python -c \
            'import lincl; print(lincl.__version__)')"
          test "${actual_version}" = "${expected_version}"
          /tmp/lincl-sdist/bin/python \
            "${GITHUB_WORKSPACE}/scripts/verify_installation.py"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
