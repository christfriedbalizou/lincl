---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches:
      - main
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ".github"
          permission-actions: write

      - name: Run Renovate
        id: dispatch
        env:
          DISTINCT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          run_url="$(gh workflow run renovate.yaml \
            --repo "${{ github.repository_owner }}/.github" \
            --ref main \
            --field "autodiscoverFilter=${REPO_NAME}" \
            --field "distinct_id=${DISTINCT_ID}")"
          run_id="${run_url##*/}"
          case "${run_id}" in
            ""|*[!0-9]*)
              echo "Unable to determine the dispatched Renovate run ID" >&2
              exit 1
              ;;
          esac
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Await Renovate Completion
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          gh run watch \
            --repo "${{ github.repository_owner }}/.github" \
            "${RUN_ID}" \
            --exit-status

      - name: Renovate Output
        if: ${{ always() && steps.dispatch.outputs.run_id != '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |-
          gh run view \
            --repo "${{ github.repository_owner }}/.github" \
            --log "${RUN_ID}"
