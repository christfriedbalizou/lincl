name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Verify release and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked release tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python -c 'import lincl; print(lincl.__version__)')"
          test "${RELEASE_TAG}" = "v${package_version}"
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run tests
        run: python -m pytest
      - name: Audit locked development dependencies
        run: pip-audit --require-hashes -r requirements-dev.txt
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Test built wheel and source distribution
        run: |
          python -m venv /tmp/lincl-release-wheel
          /tmp/lincl-release-wheel/bin/python -m pip install \
            --no-deps dist/*.whl
          cd /tmp
          /tmp/lincl-release-wheel/bin/python -c \
            "import lincl; assert lincl.__version__"
          cd "${GITHUB_WORKSPACE}"
          python -m venv /tmp/lincl-release-sdist
          /tmp/lincl-release-sdist/bin/python -m pip install \
            --no-deps dist/*.tar.gz
          cd /tmp
          /tmp/lincl-release-sdist/bin/python -c \
            "import lincl; assert lincl.__version__"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lincl/
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Attest distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
